[package]
name = "czkawka_cli"
version = "12.0.2"
authors = ["Rafał Mikrut <mikrutrafal@protonmail.com>"]
edition = "2024"
rust-version = "1.94.1"
description = "CLI frontend of Czkawka"
license = "MIT"
repository = "https://github.com/Papamzor/czkawka"

[dependencies]
clap = { version = "4.6", features = ["derive", "color"] }
clap_complete = "4.5"

log = "0.4.35"
czkawka_core = { path = "../czkawka_core", version = "12.0.2", features = [] }
indicatif = "0.18"
crossbeam-channel = { version = "0.5", features = [] }
ctrlc = { version = "3.5", features = ["termination"] }

[features]
default = []

[lints]
workspace = true
