[package]
name = "czkawka_app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Plekke: desktop app on czkawka_core, styled with mwp-ui"
license = "MIT"
publish = false

[dependencies]
czkawka_core = { path = "../czkawka_core" }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.35"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
